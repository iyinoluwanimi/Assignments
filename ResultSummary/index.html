<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | Results summary component</title>
</head>
<body>
      <main class="container">

    <section class="result">
      <h2 class="result-title">Your Result</h2>

      <div class="score-circle">
        <p class="score-number">76</p>
        <p class="score-total">of 100</p>
      </div>

      <h3 class="result-heading">Great</h3>
      <p class="result-text">You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="summary">
      <h2 class="summary-title">Summary</h2>

      <ul class="summary-list">
        <li class="item reaction">
          <div class="left-item">
            <img class="icon" src="images/icon-reaction.svg" alt="" width="20" height="20">
            <span class="item-name">Reaction</span>
          </div>
          <p class="item-score"><span class="bold-score">80</span> / 100</p>
        </li>

        <li class="item memory">
          <div class="left-item">
            <img class="icon" src="images/icon-memory.svg" alt="" width="20" height="20">
            <span class="item-name">Memory</span>
          </div>
          <p class="item-score"><span class="bold-score">92</span> / 100</p>
        </li>

        <li class="item verbal">
          <div class="left-item">
            <img class="icon" src="images/icon-verbal.svg" alt="" width="20" height="20">
            <span class="item-name">Verbal</span>
          </div>
          <p class="item-score"><span class="bold-score">61</span> / 100</p>
        </li>

        <li class="item visual">
          <div class="left-item">
            <img class="icon" src="images/icon-visual.svg" alt="" width="20" height="20">
            <span class="item-name">Visual</span>
          </div>
          <p class="item-score"><span class="bold-score">73</span> / 100</p>
        </li>
      </ul>

      <button class="button" type="button">Continue</button>
    </section>

  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Balogun Iyinoluwa</a>.
  </footer>

</body>
</html>
